[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-veille-mcp"
version = "0.1.0"
description = "Agent de veille documentaire avec RAG, function calling et serveur MCP"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-chroma>=0.1.0",
    "langchain-groq>=1.1.3",
    "sentence-transformers>=3.0.0",
    "chromadb>=0.5.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "mcp>=1.0.0",
    "langchain-huggingface>=1.2.2",
    "langchain-text-splitters>=1.1.2",
    "pydantic-settings>=2.15.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_veille"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]